services:
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: wyoming-openwakeword
    restart: unless-stopped
    command:
      - --uri
      - tcp://0.0.0.0:10400
      - --threshold
      - ${WAKE_WORD_THRESHOLD:-0.18}
      - --trigger-level
      - ${WAKE_WORD_TRIGGER_LEVEL:-1}
      - --refractory-seconds
      - ${WAKE_WORD_REFRACTORY_SECONDS:-8.0}
      - --preload-model
      - ${WAKE_WORD_MODEL:-hey_jarvis}
    ports:
      - "10400:10400"

  speech-to-phrase:
    image: rhasspy/wyoming-speech-to-phrase:latest
    container_name: wyoming-speech-to-phrase
    restart: unless-stopped
    command:
      - --uri
      - tcp://0.0.0.0:10300
      - --hass-websocket-uri
      - ${SPEECH_TO_PHRASE_HASS_WEBSOCKET_URI:-ws://host.docker.internal:8123/api/websocket}
      - --hass-token
      - ${SPEECH_TO_PHRASE_HASS_TOKEN:-}
      - --custom-sentences-dir
      - /custom_sentences
      - --retrain-on-start
    ports:
      - "10300:10300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./speech-to-phrase-models:/models
      - ./speech-to-phrase-train:/train
      - ${SPEECH_TO_PHRASE_CUSTOM_SENTENCES_DIR:-/home/lucas/homeassistant-bootstrap/custom_sentences}:/custom_sentences:ro

  whisper:
    profiles:
      - whisper
    build:
      context: ./whisper_patch
    image: ha-local/wyoming-whisper:patched
    container_name: wyoming-whisper
    restart: unless-stopped
    command:
      - --model
      - ${WHISPER_MODEL:-base-int8}
      - --language
      - ${WHISPER_LANGUAGE:-en}
      - --beam-size
      - ${WHISPER_BEAM_SIZE:-1}
      - --cpu-threads
      - ${WHISPER_CPU_THREADS:-2}
      - --initial-prompt
      - "${WHISPER_INITIAL_PROMPT:-}"
      - --vad-filter
      - --vad-min-speech-ms
      - ${WHISPER_VAD_MIN_SPEECH_MS:-200}
      - --vad-min-silence-ms
      - ${WHISPER_VAD_MIN_SILENCE_MS:-700}
      - --uri
      - tcp://0.0.0.0:10300
      - --data-dir
      - /data
      - --download-dir
      - /data
    ports:
      - "10301:10300"
    volumes:
      - ./whisper-data:/data

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    command:
      - --voice
      - ${PIPER_VOICE:-en_US-lessac-medium}
      - --uri
      - tcp://0.0.0.0:10200
      - --data-dir
      - /data
      - --download-dir
      - /data
    ports:
      - "10200:10200"
    volumes:
      - ./piper-data:/data
